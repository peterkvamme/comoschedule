<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Carousel Schedule</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif}#page{width:100vw;height:100vh;padding:2.4vh 4vw;display:flex;flex-direction:column}#dayTitle{width:calc(100% + 6vw);margin-left:-3vw;text-align:center;font-weight:900;white-space:nowrap;line-height:.86;letter-spacing:-.01em}#notice{display:none;align-self:center;max-width:94%;margin:1.1vh auto 1vh;padding:.7vh 3.2vw;border-radius:999px;background:#fff;color:#e11d48;box-shadow:0 3px 8px #0003;font-weight:900;text-align:center;white-space:nowrap;line-height:1}#schedule{width:100%;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(3px,.7vh,10px);overflow:hidden}.row{width:100%;display:flex;align-items:baseline;gap:clamp(14px,2.4vw,26px);white-space:nowrap;line-height:1;padding:.12vh 2.5vw}.row.lunch{padding-left:11.5vw;gap:clamp(12px,2vw,22px)}.name{font-weight:900}.time{font-weight:400;font-variant-numeric:tabular-nums}</style></head>
<body><main id="page"><div id="dayTitle"></div><div id="notice"></div><div id="schedule"></div></main><script src="config.js"></script><script>
(function(){"use strict";var c=window.CAROUSEL_CONFIG||{dayType:"A",heading:"A DAY",schedule:[],notifications:[]};if(new URLSearchParams(location.search).get("preview")==="1"){try{c=JSON.parse(sessionStorage.getItem("carouselPreview"))||c}catch(e){}}var type=c.dayType==="B"?"B":"A",title=document.getElementById("dayTitle"),notice=document.getElementById("notice"),schedule=document.getElementById("schedule");document.body.style.background=type==="A"?"#FFD700":"#000";document.body.style.color=type==="A"?"#000":"#fff";title.textContent=c.heading||"";
function dateKey(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}var n=(c.notifications||[]).find(function(x){return x.date===dateKey()});if(n&&n.text.trim()){notice.textContent=n.text;notice.style.display="block"}(c.schedule||[]).forEach(function(x){var r=document.createElement("div"),a=document.createElement("div"),b=document.createElement("div");r.className="row"+(x.size==="lunch"?" lunch":"");a.className="name";b.className="time";a.textContent=x.name||"";b.textContent=x.time||"";r.append(a,b);schedule.append(r)});
function fitLine(el,w,h){var lo=12,hi=500,best=12;while(lo<=hi){var mid=Math.floor((lo+hi)/2);el.style.fontSize=mid+"px";if(el.scrollWidth<=innerWidth*w&&el.scrollHeight<=innerHeight*h){best=mid;lo=mid+1}else hi=mid-1}el.style.fontSize=best+"px"}function fitRows(){var main=[].slice.call(schedule.querySelectorAll(".row:not(.lunch)")),lunch=[].slice.call(schedule.querySelectorAll(".row.lunch")),all=main.concat(lunch),lo=12,hi=110,best=12;if(!all.length)return;while(lo<=hi){var mid=Math.floor((lo+hi)/2),ok=true;main.forEach(function(r){r.style.fontSize=mid+"px"});lunch.forEach(function(r){r.style.fontSize=mid*.8+"px"});all.forEach(function(r){var k=r.children,g=parseFloat(getComputedStyle(r).columnGap||getComputedStyle(r).gap||0)||0,w=(k[0]?k[0].scrollWidth:0)+(k[1]?k[1].scrollWidth:0)+g+2;if(w>schedule.clientWidth*.99)ok=false});if(ok){best=mid;lo=mid+1}else hi=mid-1}function apply(){main.forEach(function(r){r.style.fontSize=best+"px"});lunch.forEach(function(r){r.style.fontSize=best*.8+"px"})}apply();for(var i=0;schedule.scrollHeight>schedule.clientHeight&&i<50;i++){best*=.95;apply()}}function fit(){fitLine(title,.995,.3);if(notice.style.display!=="none")fitLine(notice,.88,.09);fitRows()}addEventListener("resize",fit);requestAnimationFrame(fit)})();
</script></body></html>
