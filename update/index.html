<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Carousel Notification</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif;background:#f0f4f8}#page{width:100vw;height:100vh;padding:2.4vh 4vw;display:none;flex-direction:column}#heading{width:calc(100% + 6vw);margin-left:-3vw;text-align:center;font-weight:900;white-space:nowrap;line-height:.86}#schedule{width:100%;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(3px,.7vh,10px);overflow:hidden}.row{width:100%;display:flex;align-items:baseline;gap:clamp(14px,2.4vw,26px);white-space:nowrap;line-height:1;padding:.12vh 2.5vw}.row.small{padding-left:11.5vw}.name{font-weight:900}.time{font-weight:400;font-variant-numeric:tabular-nums}</style></head><body><main id="page"><div id="heading"></div><div id="schedule"></div></main><script src="config.js"></script><script>
(function(){"use strict";function key(){var d=new Date;return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}var item=null;if(new URLSearchParams(location.search).get("preview")==="1"){try{item=JSON.parse(sessionStorage.getItem("carouselPreview"))}catch(e){}}if(!item)item=((window.CAROUSEL_CONFIG||{}).notifications||[]).find(function(x){return x.date===key()});if(!item)return;var page=document.getElementById("page"),heading=document.getElementById("heading"),schedule=document.getElementById("schedule"),type=item.dayType==="B"?"B":"A";page.style.display="flex";document.body.style.background=type==="A"?"#FFD700":"#000";document.body.style.color=type==="A"?"#000":"#fff";heading.textContent=item.heading||"";(item.schedule||[]).forEach(function(x){var r=document.createElement("div"),a=document.createElement("div"),b=document.createElement("div");r.className="row"+(x.size==="small"?" small":"");a.className="name";b.className="time";a.textContent=x.name||"";b.textContent=x.time||"";r.append(a,b);schedule.append(r)});
function fitLine(el){var lo=12,hi=500,best=12;while(lo<=hi){var m=Math.floor((lo+hi)/2);el.style.fontSize=m+"px";if(el.scrollWidth<=innerWidth*.97&&el.scrollHeight<=innerHeight*.3){best=m;lo=m+1}else hi=m-1}el.style.fontSize=best+"px"}function fitRows(){var main=[].slice.call(schedule.querySelectorAll(".row:not(.small)")),small=[].slice.call(schedule.querySelectorAll(".row.small")),all=main.concat(small),lo=12,hi=110,best=12;if(!all.length)return;while(lo<=hi){var m=Math.floor((lo+hi)/2),ok=true;main.forEach(function(r){r.style.fontSize=m+"px"});small.forEach(function(r){r.style.fontSize=m*.8+"px"});all.forEach(function(r){var k=r.children,s=getComputedStyle(r),g=parseFloat(s.gap)||0,p=(parseFloat(s.paddingLeft)||0)+(parseFloat(s.paddingRight)||0),needed=k[0].scrollWidth+k[1].scrollWidth+g+4,available=(r.clientWidth-p)*.97;if(needed>available)ok=false});if(ok){best=m;lo=m+1}else hi=m-1}function apply(){main.forEach(function(r){r.style.fontSize=best+"px"});small.forEach(function(r){r.style.fontSize=best*.8+"px"})}apply();for(var i=0;schedule.scrollHeight>schedule.clientHeight&&i<50;i++){best*=.95;apply()}}function fit(){fitLine(heading);fitRows()}addEventListener("resize",fit);requestAnimationFrame(fit)})();
</script></body></html>
