<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notification Editor</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#172033;font:16px Arial,sans-serif}main{max-width:960px;margin:auto;padding:28px 18px 60px}h1{margin:0 0 8px}.hint{color:#536174}.notice{background:#fff;border-radius:14px;padding:18px;margin:18px 0;box-shadow:0 2px 12px #1f293714}.top{display:grid;grid-template-columns:180px 1fr 48px;gap:10px}.style{display:flex;gap:18px;margin:16px 0}.row{display:grid;grid-template-columns:1.5fr 1fr 110px 44px;gap:8px;margin:8px 0}input,select,button{min-height:42px;border:1px solid #c7d0dc;border-radius:8px;padding:8px 10px;font:inherit}button{cursor:pointer;background:#fff;font-weight:700}.remove{color:#b91c1c;font-size:22px;padding:0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.primary{background:#175cd3;color:#fff}.preview{margin-top:12px}#status{margin-top:12px;font-weight:700}@media(max-width:650px){.top,.row{grid-template-columns:1fr}.remove{width:44px}}</style></head><body><main><h1>Carousel notification editor</h1><p class="hint">Each date below is a separate complete display with its own formatting, heading, and information rows.</p><div id="notices"></div><button id="addNotice">+ Add another dated notification</button><div class="actions"><button class="primary" id="download">Download config.js</button></div><div id="status"></div></main><script src="config.js"></script><script>
"use strict";var host=document.getElementById("notices"),source=(window.CAROUSEL_CONFIG||{}).notifications||[];
function addRow(rows,x){var r=document.createElement("div");r.className="row info-row";r.innerHTML='<input class="name" placeholder="Information"><input class="time" placeholder="Time or details"><select class="size"><option value="main">Main</option><option value="small">Smaller</option></select><button class="remove" type="button">×</button>';r.querySelector(".name").value=x.name||"";r.querySelector(".time").value=x.time||"";r.querySelector(".size").value=x.size==="small"?"small":"main";r.querySelector(".remove").onclick=function(){r.remove()};rows.append(r)}
function addNotice(x){var card=document.createElement("section");card.className="notice";card.innerHTML='<div class="top"><input type="date" class="date"><input class="heading" placeholder="Heading text"><button class="remove remove-notice" type="button">×</button></div><div class="style"><label><input type="radio" value="A"> A Day formatting (gold)</label><label><input type="radio" value="B"> B Day formatting (black)</label></div><div class="rows"></div><button class="add-row" type="button">+ Add information row</button><br><button class="preview" type="button">Preview this date</button>';card.querySelector(".date").value=x.date||"";card.querySelector(".heading").value=x.heading||"";var group="style"+Date.now()+Math.random();card.querySelectorAll('.style input').forEach(function(r){r.name=group;if(r.value===(x.dayType==="B"?"B":"A"))r.checked=true});var rows=card.querySelector(".rows");(x.schedule||[]).forEach(function(y){addRow(rows,y)});card.querySelector(".add-row").onclick=function(){addRow(rows,{})};card.querySelector(".remove-notice").onclick=function(){card.remove()};card.querySelector(".preview").onclick=function(){try{sessionStorage.setItem("carouselPreview",JSON.stringify(readCard(card)));open("index.html?preview=1","_blank")}catch(e){report(e.message,1)}};host.append(card)}
function readCard(card){var item={date:card.querySelector(".date").value,dayType:card.querySelector('.style input:checked').value,heading:card.querySelector(".heading").value.trim(),schedule:[]};if(!item.date)throw Error("Every notification needs a date.");card.querySelectorAll(".info-row").forEach(function(r){var n=r.querySelector(".name").value.trim(),t=r.querySelector(".time").value.trim();if(n||t)item.schedule.push({name:n,time:t,size:r.querySelector(".size").value})});return item}function collect(){var out={notifications:[]},dates={};document.querySelectorAll(".notice").forEach(function(c){var x=readCard(c);if(dates[x.date])throw Error("Only one notification can be scheduled for "+x.date+".");dates[x.date]=1;out.notifications.push(x)});out.notifications.sort(function(a,b){return a.date.localeCompare(b.date)});return out}function report(x,e){var s=document.getElementById("status");s.textContent=x;s.style.color=e?"#b42318":"#216e39"}
source.forEach(addNotice);if(!source.length)addNotice({dayType:"A",schedule:[]});document.getElementById("addNotice").onclick=function(){addNotice({dayType:"A",schedule:[]})};document.getElementById("download").onclick=function(){try{var blob=new Blob(["window.CAROUSEL_CONFIG = "+JSON.stringify(collect(),null,2)+";\n"],{type:"text/javascript"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="config.js";a.click();report("Downloaded config.js. Replace the existing config.js in GitHub.")}catch(e){report(e.message,1)}};
</script></body></html>
