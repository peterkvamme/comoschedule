<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schedule Editor</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#172033;font:16px/1.4 Arial,sans-serif}main{max-width:920px;margin:auto;padding:28px 18px 60px}h1{margin:0 0 4px}h2{margin:28px 0 10px}.hint{color:#536174}.card{background:#fff;border-radius:14px;padding:18px}.choice,.actions{display:flex;gap:14px;flex-wrap:wrap}.item{display:grid;grid-template-columns:1.5fr 1fr 110px 44px;gap:8px;margin:8px 0}.notification{grid-template-columns:170px 1fr 44px}input,select,button{min-height:42px;border:1px solid #c7d0dc;border-radius:8px;padding:8px;font:inherit}button{cursor:pointer;background:#fff;font-weight:700}.remove{color:#b91c1c;font-size:22px}.actions{margin-top:18px}.primary{background:#175cd3;color:#fff}#status{margin-top:12px;font-weight:700}@media(max-width:650px){.item,.notification{grid-template-columns:1fr}}</style></head><body><main><h1>Carousel schedule editor</h1><p class="hint">Make changes, preview them, then download config.js and replace that file in GitHub.</p><section class="card"><h2>Display style</h2><div class="choice"><label><input type="radio" name="dayType" value="A"> A Day (gold)</label><label><input type="radio" name="dayType" value="B"> B Day (black)</label></div><h2>Schedule</h2><div id="schedule"></div><button id="addRow">+ Add schedule row</button><h2>Notifications</h2><p class="hint">Choose exact dates. Only one notification is allowed per day.</p><div id="notifications"></div><button id="addNotification">+ Add notification</button><div class="actions"><button id="preview">Preview display</button><button class="primary" id="download">Download config.js</button></div><div id="status"></div></section></main><script src="config.js"></script><script>
"use strict";var source=window.CAROUSEL_CONFIG||{dayType:"A",schedule:[],notifications:[]},s=document.getElementById("schedule"),n=document.getElementById("notifications");
function addSchedule(x){var r=document.createElement("div");r.className="item schedule-item";r.innerHTML='<input class="row-name" placeholder="Period 1"><input class="row-time" placeholder="8:30-9:50"><select class="row-size"><option value="main">Main</option><option value="lunch">Smaller</option></select><button class="remove" type="button">×</button>';r.querySelector(".row-name").value=x.name||"";r.querySelector(".row-time").value=x.time||"";r.querySelector(".row-size").value=x.size==="lunch"?"lunch":"main";r.querySelector(".remove").onclick=function(){r.remove()};s.append(r)}
function addNotice(x){var r=document.createElement("div");r.className="item notification";r.innerHTML='<input type="date" class="notice-date"><input class="notice-text" placeholder="Notification text"><button class="remove" type="button">×</button>';r.querySelector(".notice-date").value=x.date||"";r.querySelector(".notice-text").value=x.text||"";r.querySelector(".remove").onclick=function(){r.remove()};n.append(r)}
document.querySelector('input[value="'+(source.dayType==="B"?"B":"A")+'"]').checked=true;(source.schedule||[]).forEach(addSchedule);(source.notifications||[]).forEach(addNotice);document.getElementById("addRow").onclick=function(){addSchedule({})};document.getElementById("addNotification").onclick=function(){addNotice({})};
function collect(){var c={dayType:document.querySelector('input[name="dayType"]:checked').value,schedule:[],notifications:[]},dates={};document.querySelectorAll(".schedule-item").forEach(function(r){var a=r.querySelector(".row-name").value.trim(),b=r.querySelector(".row-time").value.trim();if(a||b)c.schedule.push({name:a,time:b,size:r.querySelector(".row-size").value})});document.querySelectorAll(".notification").forEach(function(r){var d=r.querySelector(".notice-date").value,t=r.querySelector(".notice-text").value.trim();if(!d&&!t)return;if(!d||!t)throw Error("Every notification needs both a date and message.");if(dates[d])throw Error("More than one notification is scheduled for "+d+".");dates[d]=1;c.notifications.push({date:d,text:t})});c.notifications.sort(function(a,b){return a.date.localeCompare(b.date)});return c}function report(x,e){var z=document.getElementById("status");z.textContent=x;z.style.color=e?"#b42318":"#216e39"}
document.getElementById("download").onclick=function(){try{var b=new Blob(["window.CAROUSEL_CONFIG = "+JSON.stringify(collect(),null,2)+";\n"],{type:"text/javascript"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="config.js";a.click();report("Downloaded config.js. Replace the existing file in GitHub.")}catch(e){report(e.message,1)}};document.getElementById("preview").onclick=function(){try{sessionStorage.setItem("carouselPreview",JSON.stringify(collect()));open("index.html?preview=1","_blank")}catch(e){report(e.message,1)}};
</script></body></html>
