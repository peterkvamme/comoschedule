<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Como Schedule</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0;
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            overflow: hidden;
            background-color: #f0f4f8;
            box-sizing: border-box;
        }

        #scaling-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            text-align: center;
            transition: transform 0.2s;
            transform-origin: center center;
        }

        #period-display {
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #mainContainer, #subContainer, #timeContainer {
            width: 100%;
            display: flex;
            justify-content: center;
            text-align: center;
        }

        .text-line {
            margin: 0; padding: 0;
            line-height: 0.85;
            white-space: nowrap;
            display: inline-block;
            font-variant-numeric: tabular-nums;
            text-align: center;
        }
        
        /* ACCESSIBLE WHITE PILL BOX */
        #activityLabel { 
            font-weight: 900; 
            color: #FF3B30; 
            background-color: white;
            display: none; /* Controlled by secret button */
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 3vh;
            padding: 0.8vh 5vw;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            text-align: center;
        }

        #mainText { font-weight: 700; }
        #subText { font-weight: 500; margin-top: 4vh; }
        #timeText { font-weight: 500; margin-top: 1vh; }

        #toggleBtn {
            position: fixed;
            bottom: 15px;
            right: 15px;
            width: 50px;
            height: 35px;
            background: rgba(128, 128, 128, 0.08);
            border: 1px solid rgba(128, 128, 128, 0.2);
            border-radius: 8px;
            cursor: pointer;
            z-index: 999;
            -webkit-appearance: none;
            outline: none;
        }
        
        #toggleBtn:active {
            background: rgba(128, 128, 128, 0.2);
        }

        #testToggle {
            position: fixed; left: 8px; bottom: 8px; z-index: 1000;
            border: 2px solid #fff; outline: 2px solid #2563eb;
            border-radius: 9px; padding: 7px 11px;
            background: #f2b620; color: #000;
            font: 800 13px Arial, sans-serif; cursor: pointer;
        }

        #testPanel {
            display: none; position: fixed; left: 8px; bottom: 52px; z-index: 1001;
            width: min(300px, calc(100vw - 16px));
            padding: 10px; border-radius: 10px; background: #fff; color: #111827;
            box-shadow: 0 4px 18px rgba(0,0,0,.35); font: 12px Arial, sans-serif;
        }
        #testPanel.open { display: block; }
        #testPanel strong { display: block; margin-bottom: 7px; }
        #testPanel label { display: block; margin-top: 7px; font-size: 10px; font-weight: 700; }
        #testPanel input { width: 100%; margin-top: 2px; padding: 6px; font: 12px Arial, sans-serif; }
        #testButtons { display: flex; gap: 6px; margin-top: 8px; }
        #testButtons button { flex: 1; padding: 7px 5px; border: 0; border-radius: 6px; font-weight: 700; cursor: pointer; }
        #applyTest { background: #111827; color: white; }
        #useLive { background: #dbe3ee; color: #111827; }
        #testStatus { margin-top: 6px; font-size: 10px; font-weight: 800; }
    </style>
</head>
<body>

    <div id="scaling-wrapper">
        <div style="width: 100%; display: flex; justify-content: center;">
            <div id="activityLabel" class="text-line">Activity Day</div>
        </div>
        
        <div id="period-display">
            <div id="mainContainer"><p class="text-line" id="mainText">&nbsp;</p></div>
            <div id="subContainer"><p class="text-line" id="subText"></p></div>
            <div id="timeContainer"><p class="text-line" id="timeText"></p></div>
        </div>
    </div>

    <button id="toggleBtn" onclick="toggleSchedule()"></button>
    <button id="testToggle" type="button">TEST</button>
    <div id="testPanel" aria-hidden="true">
        <strong>Test date/time</strong>
        <label>Date<input id="testDate" type="date"></label>
        <label>Time<input id="testTime" type="time" step="60"></label>
        <div id="testButtons">
            <button id="applyTest" type="button">Use Test</button>
            <button id="useLive" type="button">Use Live</button>
        </div>
        <div id="testStatus">LIVE</div>
    </div>
    
    <script>
        var isActivityMode = false;
        var testDateTime = null;

        function pad2(n) { return String(n).padStart(2, "0"); }
        function dateInputValue(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
        function timeInputValue(d) { return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
        function dateKey(d) { return (d.getMonth() + 1) + "/" + d.getDate() + "/" + d.getFullYear(); }
        function getDisplayDate() { return testDateTime ? new Date(testDateTime.getTime()) : new Date(); }

        var activityPeriods = [{name:"Period 1",start:"08:30",end:"09:30"},{name:"Passing Time",start:"09:30",end:"09:35"},{name:"Period 2",start:"09:35",end:"10:35"},{name:"Passing Time",start:"10:35",end:"10:40"},{name:"Period 4",start:"10:40",end:"11:50"},{name:"Passing Time",start:"11:50",end:"11:55"},{name:"Period 3",start:"11:55",end:"13:40"},{name:"Passing Time",start:"13:40",end:"13:45"},{name:"Seminar",start:"13:45",end:"15:00"}];
        var normalPeriods = [{name:"Period 1",start:"08:30",end:"09:50"},{name:"Passing Time",start:"09:50",end:"09:55"},{name:"Seminar",start:"09:55",end:"10:30"},{name:"Passing Time",start:"10:30",end:"10:35"},{name:"Period 2",start:"10:35",end:"11:50"},{name:"Passing Time",start:"11:50",end:"11:55"},{name:"Period 3",start:"11:55",end:"13:40"},{name:"Passing Time",start:"13:40",end:"13:45"},{name:"Period 4",start:"13:45",end:"15:00"}];

        var aDays = ["9/8/2026", "9/10/2026", "9/14/2026", "9/16/2026", "9/18/2026", "9/23/2026", "9/25/2026", "9/29/2026", "10/1/2026", "10/5/2026", "10/7/2026", "10/9/2026", "10/13/2026", "10/19/2026", "10/21/2026", "10/23/2026", "10/27/2026", "10/29/2026", "11/2/2026", "11/4/2026", "11/6/2026", "11/10/2026", "11/12/2026", "11/17/2026", "11/19/2026", "11/23/2026", "11/25/2026", "12/1/2026", "12/3/2026", "12/7/2026", "12/9/2026", "12/11/2026", "12/15/2026", "12/17/2026", "12/21/2026", "1/4/2027", "1/6/2027", "1/8/2027", "1/12/2027", "1/14/2027", "1/19/2027", "1/21/2027", "1/25/2027", "1/27/2027", "2/1/2027", "2/3/2027", "2/5/2027", "2/9/2027", "2/11/2027", "2/16/2027", "2/18/2027", "2/22/2027", "2/24/2027", "2/26/2027", "3/2/2027", "3/4/2027", "3/8/2027", "3/11/2027", "3/15/2027", "3/17/2027", "3/19/2027", "3/23/2027", "3/25/2027", "3/29/2027", "3/31/2027", "4/2/2027", "4/13/2027", "4/15/2027", "4/19/2027", "4/21/2027", "4/23/2027", "4/27/2027", "4/29/2027", "5/3/2027", "5/5/2027", "5/7/2027", "5/11/2027", "5/13/2027", "5/18/2027", "5/20/2027", "5/24/2027", "5/26/2027", "5/28/2027", "6/2/2027", "6/4/2027", "6/8/2027", "6/10/2027"];
        var bDays = ["9/9/2026", "9/11/2026", "9/15/2026", "9/17/2026", "9/22/2026", "9/24/2026", "9/28/2026", "9/30/2026", "10/2/2026", "10/6/2026", "10/8/2026", "10/12/2026", "10/14/2026", "10/20/2026", "10/22/2026", "10/26/2026", "10/28/2026", "10/30/2026", "11/3/2026", "11/5/2026", "11/9/2026", "11/11/2026", "11/16/2026", "11/18/2026", "11/20/2026", "11/24/2026", "11/30/2026", "12/2/2026", "12/4/2026", "12/8/2026", "12/10/2026", "12/14/2026", "12/16/2026", "12/18/2026", "12/22/2026", "1/5/2027", "1/7/2027", "1/11/2027", "1/13/2027", "1/15/2027", "1/20/2027", "1/22/2027", "1/26/2027", "1/28/2027", "2/2/2027", "2/4/2027", "2/8/2027", "2/10/2027", "2/12/2027", "2/17/2027", "2/19/2027", "2/23/2027", "2/25/2027", "3/1/2027", "3/3/2027", "3/5/2027", "3/9/2027", "3/12/2027", "3/16/2027", "3/18/2027", "3/22/2027", "3/24/2027", "3/26/2027", "3/30/2027", "4/1/2027", "4/12/2027", "4/14/2027", "4/16/2027", "4/20/2027", "4/22/2027", "4/26/2027", "4/28/2027", "4/30/2027", "5/4/2027", "5/6/2027", "5/10/2027", "5/12/2027", "5/14/2027", "5/19/2027", "5/21/2027", "5/25/2027", "5/27/2027", "6/1/2027", "6/3/2027", "6/7/2027", "6/9/2027", "6/11/2027"];

        function toggleSchedule() {
            isActivityMode = !isActivityMode;
            var label = document.getElementById("activityLabel");
            label.style.display = isActivityMode ? "inline-block" : "none";
            update();
        }

        function fitToWidth(e, w) {
            if (!e || e.innerText === "" || e.innerHTML === "&nbsp;") return;
            var s = 10;
            e.style.fontSize = s + "px";
            var maxW = window.innerWidth * w;
            while (e.offsetWidth < maxW && s < 800) {
                s += 2;
                e.style.fontSize = s + "px";
            }
            s -= 4;
            e.style.fontSize = s + "px";
        }

        function update() {
            var now = getDisplayDate();
            var curr = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
            var d = (now.getMonth() + 1) + "/" + now.getDate() + "/" + now.getFullYear();
            var dt = null;
            if (aDays.indexOf(d) > -1) dt = "A";
            else if (bDays.indexOf(d) > -1) dt = "B";

            document.body.style.backgroundColor = (dt === "A" ? "#f2b620" : (dt === "B" ? "black" : "#f0f4f8"));
            document.body.style.color = (dt === "A" ? "black" : (dt === "B" ? "white" : "#1a202c"));

            var m = document.getElementById("mainText"), s = document.getElementById("subText"), t = document.getElementById("timeText");
            var actL = document.getElementById("activityLabel");

            if (!dt) {
                m.innerText = "No School Today"; s.innerText = ""; t.innerText = "";
                fitToWidth(m, 0.92); return;
            }

            var activeSchedule = isActivityMode ? activityPeriods : normalPeriods;
            var cp = null, pi = -1;

            for (var i = 0; i < activeSchedule.length; i++) {
                var p = activeSchedule[i], st = p.start.split(':'), en = p.end.split(':');
                var sS = parseInt(st[0])*3600 + parseInt(st[1])*60, eS = parseInt(en[0])*3600 + parseInt(en[1])*60;
                if (curr >= sS && curr < eS) { cp = p; pi = i; break; }
            }

            if (cp) {
                var pn = cp.name, tl = "Time Left";
                if (dt === "B" && pn === "Seminar") pn = "Club period";
                if (pn.indexOf("Period") > -1) pn += dt;
                if (pn.indexOf("Passing") > -1 && pi < activeSchedule.length - 1) {
                    var n = activeSchedule[pi + 1].name;
                    if (n.indexOf("Period") > -1) n = n.replace("Period ", "") + dt;
                    else if (n === "Seminar") n = (dt === "B") ? "Club" : "Seminar";
                    tl = "Until " + n;
                }
                var ep = cp.end.split(':'), rem = (parseInt(ep[0])*3600 + parseInt(ep[1])*60) - curr;
                var min = Math.floor(rem/60), sec = rem % 60;
                m.innerText = pn; s.innerText = tl;
                t.innerText = (min < 10 ? "0"+min : min) + ":" + (sec < 10 ? "0"+sec : sec);
            } else {
                var f = activeSchedule[0].start.split(':'), sS = parseInt(f[0])*3600 + parseInt(f[1])*60;
                if (curr < sS) {
                    m.innerText = dt + " Day"; s.innerText = "Starts In";
                    var df = sS - curr;
                    var m2 = Math.floor(df/60), s2 = df % 60;
                    t.innerText = (m2 < 10 ? "0"+m2 : m2) + ":" + (s2 < 10 ? "0"+s2 : s2);
                } else { m.innerText = "School out"; s.innerText = ""; t.innerText = ""; }
            }
            
            if(isActivityMode) fitToWidth(actL, 0.40); 
            fitToWidth(m, 0.92);
            fitToWidth(s, 0.75);
            fitToWidth(t, 0.75);

            var wrapper = document.getElementById("scaling-wrapper");
            var totalHeight = wrapper.offsetHeight;
            var maxHeight = window.innerHeight * 0.92;
            
            if (totalHeight > maxHeight) {
                var ratio = maxHeight / totalHeight;
                wrapper.style.transform = "scale(" + ratio + ")";
            } else {
                wrapper.style.transform = "scale(1)";
            }
        }

        window.onload = function() {
            var live = new Date();
            document.getElementById("testDate").value = dateInputValue(live);
            document.getElementById("testTime").value = timeInputValue(live);
            var testToggle = document.getElementById("testToggle");
            var testPanel = document.getElementById("testPanel");
            testToggle.addEventListener("click", function() {
                testPanel.classList.toggle("open");
                testPanel.setAttribute("aria-hidden", testPanel.classList.contains("open") ? "false" : "true");
            });
            document.getElementById("applyTest").addEventListener("click", function() {
                var dv = document.getElementById("testDate").value;
                var tv = document.getElementById("testTime").value || "00:00";
                if (!dv) return;
                var dp = dv.split("-").map(Number), tp = tv.split(":").map(Number);
                testDateTime = new Date(dp[0], dp[1] - 1, dp[2], tp[0] || 0, tp[1] || 0, 0, 0);
                document.getElementById("testStatus").textContent = "TESTING: " + dateKey(testDateTime) + " " + timeInputValue(testDateTime);
                update();
            });
            document.getElementById("useLive").addEventListener("click", function() {
                testDateTime = null;
                var now = new Date();
                document.getElementById("testDate").value = dateInputValue(now);
                document.getElementById("testTime").value = timeInputValue(now);
                document.getElementById("testStatus").textContent = "LIVE";
                update();
            });
            update();
            setInterval(update, 1000);
        };
    </script>
</body>
</html>
