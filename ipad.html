<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPad School Clock</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-variant-numeric: tabular-nums; 
            background-color: #f0f4f8; /* Initial color */
            overflow: hidden;
        }

        #period-display {
            width: 95vw;
            text-align: center;
        }

        /* Fixed massive sizes optimized for iPad Air 2 resolution */
        .main-text {
            font-size: 16vw; 
            font-weight: 700;
            margin: 0;
            line-height: 1.1;
        }

        .sub-text {
            font-size: 8vw;
            font-weight: 500;
            margin-top: 20px;
            line-height: 1.1;
        }
    </style>
</head>
<body>

    <div id="period-display">
        <p class="main-text" id="mainText">Loading...</p>
        <p class="sub-text" id="subText"></p>
    </div>
    
    <script>
        const aDays = new Set(["9/2", "9/4", "9/8", "9/10", "9/12", "9/16", "9/18", "9/22", "9/25", "9/29", "10/1", "10/6", "10/8", "10/10", "10/14", "10/20", "10/22", "10/24", "10/28", "10/30", "11/3", "11/5", "11/10", "11/12", "11/14", "11/18", "11/20", "11/24", "11/26", "12/2", "12/4", "12/8", "12/10", "12/12", "12/16", "12/18", "1/5", "1/7", "1/9", "1/13", "1/15", "1/20", "1/22", "1/26", "1/28", "2/2", "2/4", "2/6", "2/10", "2/12", "2/17", "2/19", "2/23", "2/25", "2/27", "3/3", "3/5", "3/9", "3/11", "3/13", "3/17", "3/19", "3/24", "3/26", "3/30", "4/1", "4/3", "4/14", "4/16", "4/20", "4/22", "4/24", "4/28", "4/30", "5/4", "5/6", "5/8", "5/12", "5/14", "5/18", "5/20", "5/22", "5/29", "6/2", "6/4", "6/8", "6/10"]);
        const bDays = new Set(["9/3", "9/5", "9/9", "9/11", "9/15", "9/17", "9/19", "9/24", "9/26", "9/30", "10/3", "10/7", "10/9", "10/13", "10/15", "10/21", "10/23", "10/27", "10/29", "10/31", "11/4", "11/6", "11/11", "11/13", "11/17", "11/19", "11/21", "11/25", "11/27", "12/1", "12/3", "12/5", "12/9", "12/11", "12/15", "12/17", "12/19", "1/6", "1/8", "1/12", "1/14", "1/16", "1/21", "1/23", "1/27", "1/29", "2/3", "2/5", "2/9", "2/11", "2/13", "2/18", "2/20", "2/24", "2/26", "3/2", "3/4", "3/6", "3/10", "3/12", "3/16", "3/18", "3/23", "3/25", "3/27", "3/31", "4/2", "4/13", "4/15", "4/17", "4/21", "4/23", "4/27", "4/29", "5/1", "5/5", "5/7", "5/11", "5/13", "5/15", "5/19", "5/21", "6/1", "6/3", "6/5", "6/9", "6/11"]);

        const periods = [
            { name: "Period 1", start: "08:30", end: "09:50" },
            { name: "Passing Time", start: "09:50", end: "09:55" },
            { name: "Seminar", start: "09:55", end: "10:30" },
            { name: "Passing Time", start: "10:30", end: "10:35" },
            { name: "Period 2", start: "10:35", end: "11:50" },
            { name: "Passing Time", start: "11:50", end: "11:55" },
            { name: "Period 3", start: "11:55", end: "13:40" },
            { name: "Passing Time", start: "13:40", end: "13:45" },
            { name: "Period 4", start: "13:45", end: "15:00" }
        ];

        function updateBackgroundColor(dayType) {
            if (dayType === "A") {
                document.body.style.backgroundColor = "yellow";
                document.body.style.color = "black";
            } else if (dayType === "B") {
                document.body.style.backgroundColor = "black";
                document.body.style.color = "white";
            } else {
                document.body.style.backgroundColor = "#f0f4f8"; 
                document.body.style.color = "#1a202c"; 
            }
        }

        function updatePeriodDisplay() {
            const now = new Date();
            const currentTime = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
            const mainTextEl = document.getElementById("mainText");
            const subTextEl = document.getElementById("subText");
            
            const today = new Date();
            const formattedDate = `${today.getMonth() + 1}/${today.getDate()}`; 
            let dayType = null;
            if (aDays.has(formattedDate)) dayType = "A";
            else if (bDays.has(formattedDate)) dayType = "B";

            updateBackgroundColor(dayType);

            if (!dayType) {
                mainTextEl.innerText = 'No School Today'; 
                subTextEl.innerText = '';
                return; 
            }

            let currentPeriod = null;
            let currentPeriodIndex = -1;

            for (let i = 0; i < periods.length; i++) {
                const p = periods[i];
                const [sH, sM] = p.start.split(':').map(Number);
                const [eH, eM] = p.end.split(':').map(Number);
                if (currentTime >= (sH*3600+sM*60) && currentTime < (eH*3600+eM*60)) {
                    currentPeriod = p;
                    currentPeriodIndex = i;
                    break;
                }
            }

            if (currentPeriod) {
                let pName = currentPeriod.name;
                let tLabel = "Time Left:"; 
                if (dayType === "B" && pName === "Seminar") pName = "Club period";
                if (pName.includes("Period")) pName += ` ${dayType}`;

                if (currentPeriod.name === "Passing Time" && currentPeriodIndex < periods.length - 1) {
                    const next = periods[currentPeriodIndex + 1];
                    let nextLabel = next.name;
                    if (nextLabel.includes("Period")) {
                        nextLabel = `${nextLabel.match(/\d+/)[0]}${dayType}`;
                    } else if (nextLabel === "Seminar") {
                        nextLabel = (dayType === "B") ? "Club" : "Seminar";
                    }
                    tLabel = `Until ${nextLabel}:`;
                }
                
                const [eH, eM] = currentPeriod.end.split(':').map(Number);
                const remain = Math.max(0, (eH*3600+eM*60) - currentTime);
                const formattedTime = `${String(Math.floor(remain/60)).padStart(2, '0')}:${String(remain%60).padStart(2, '0')}`;
                
                mainTextEl.innerText = pName;
                subTextEl.innerText = `${tLabel} ${formattedTime}`;
            } else {
                const firstStart = periods[0].start.split(':').map(Number);
                const schoolStart = firstStart[0]*3600 + firstStart[1]*60;
                const lastEnd = periods[periods.length-1].end.split(':').map(Number);
                const schoolEnd = lastEnd[0]*3600 + lastEnd[1]*60;

                if (currentTime < schoolStart) {
                    const diff = schoolStart - currentTime;
                    const formattedTime = `${String(Math.floor(diff/60)).padStart(2, '0')}:${String(diff%60).padStart(2, '0')}`;
                    mainTextEl.innerText = `${dayType} Day`;
                    subTextEl.innerText = `Starts in: ${formattedTime}`;
                } else {
                    mainTextEl.innerText = "School Out";
                    subTextEl.innerText = "";
                }
            }
        }
        
        window.onload = function() {
            updatePeriodDisplay();
            setInterval(updatePeriodDisplay, 1000);
        };
    </script>
</body>
</html>
