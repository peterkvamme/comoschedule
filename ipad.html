<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPad Full Width Clock</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-variant-numeric: tabular-nums; 
            overflow: hidden;
            background-color: #f0f4f8; 
        }

        #period-display {
            width: 94vw; /* The "Boundaries" for the text */
            text-align: center;
        }

        .main-text, .sub-text {
            margin: 0;
            padding: 0;
            line-height: 1;
            white-space: nowrap;
            display: inline-block; /* Required for accurate width measuring */
        }

        .main-text { font-weight: 700; }
        .sub-text { font-weight: 700; margin-top: 2vh; }
    </style>
</head>
<body>

    <div id="period-display">
        <div id="mainContainer"><p class="main-text" id="mainText">Loading...</p></div>
        <div id="subContainer"><p class="sub-text" id="subText"></p></div>
    </div>
    
    <script>
        // ... (Keep your aDays, bDays, and periods arrays here) ...

        function fitToWidth(element) {
            if (!element || element.innerText === "") return;
            
            // Start very small to avoid the iPad "tiny text" loop bug
            let size = 10; 
            element.style.fontSize = size + "px";
            
            const maxWidth = window.innerWidth * 0.94;
            
            // Grow the text until it fills the width
            // This is safer for old iPads than shrinking from a large size
            while (element.offsetWidth < maxWidth && size < 500) {
                size += 2;
                element.style.fontSize = size + "px";
            }
            
            // One final shrink to ensure no overflow
            if (element.offsetWidth > maxWidth) {
                size -= 2;
                element.style.fontSize = size + "px";
            }
        }

        function updatePeriodDisplay() {
            const mainTextEl = document.getElementById("mainText");
            const subTextEl = document.getElementById("subText");
            
            // ... (Your existing logic to determine pName and tLabel/formattedTime) ...
            
            // 1. Set the text
            mainTextEl.innerText = pName;
            subTextEl.innerText = `${tLabel} ${formattedTime}`;
            
            // 2. Scale them independently to fill the 94vw width
            fitToWidth(mainTextEl);
            fitToWidth(subTextEl);
            
            // 3. Update Colors
            updateBackgroundColor(getDayType());
        }

        // ... (Keep the rest of your updateBackgroundColor and Interval logic) ...
    </script>
</body>
</html>
